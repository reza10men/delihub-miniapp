<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- Prevent Telegram in-app browser from showing a white flash -->
  <meta name="theme-color" content="#1a1a2e" />

  <!-- Open Graph — Telegram uses these for link previews -->
  <meta property="og:title" content="DeliHub — قیمت تتر" />
  <meta property="og:description" content="قیمت لحظه‌ای تتر به تومان" />
  <meta property="og:type" content="website" />

  <title>DeliHub — قیمت تتر</title>

  <!-- Telegram Mini Apps SDK v2 — latest stable as of 2026 -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Single-screen wrapper — keeps content centered on any device -->
  <div id="app">

    <!-- Header bar — mimics native Telegram header feel -->
    <header id="header">
      <h1 class="header__title">DeliHub</h1>
      <span class="header__subtitle">قیمت لحظه‌ای ارزها</span>
    </header>

    <!-- Main content area -->
    <main id="content">

      <!-- Price card — the only card for this phase -->
      <section class="card" id="price-card">

        <!-- Card header with currency icon and label -->
        <div class="card__header">
          <span class="card__icon" aria-hidden="true">💵</span>
          <h2 class="card__title">قیمت تتر</h2>
          <!-- Live badge — visual only for now -->
          <span class="card__badge" id="live-badge">زنده</span>
        </div>

        <!-- Price display area -->
        <div class="card__body">
          <p class="card__price" id="price-value" aria-live="polite">
            <!-- Filled by JS — shows "..." on first load -->
            ...
          </p>
          <p class="card__label" id="price-label">
            تومان
          </p>
        </div>

        <!-- Footer — last update time + refresh button -->
        <div class="card__footer">
          <span class="card__update" id="last-update">
            در حال بارگذاری...
          </span>

          <button
            class="card__refresh-btn"
            id="refresh-btn"
            type="button"
            aria-label="بروزرسانی قیمت"
          >
            <!-- Spinner is injected by JS during loading -->
            <svg
              class="refresh-icon"
              id="refresh-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="20"
              height="20"
            >
              <polyline points="23 4 23 10 17 10" />
              <polyline points="1 20 1 14 7 14" />
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
            </svg>
            <span class="btn-text">بروزرسانی</span>
          </button>
        </div>
      </section>

    </main>

    <!-- Footer branding -->
    <footer id="footer">
      <p class="footer__text">نسخه ۱.۰.۰ — DeliHub &copy; ۲۰۲۶</p>
    </footer>

  </div>

  <!-- Application logic -->
  <script src="script.js"></script>
</body>
</html>
